<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎈 유아 놀이 게임 모음터</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 50%, #fed6e3 100%);
    padding:30px 16px 50px;
    display:flex; flex-direction:column; align-items:center;
  }
  .header {
    text-align:center; margin-bottom:28px;
  }
  .title {
    font-size:clamp(1.8rem, 6vw, 2.6rem);
    color:#ff6b6b; font-weight:900;
    text-shadow:2px 2px 0 #fff; margin-bottom:8px;
  }
  .subtitle {
    font-size:1rem; color:#666;
  }
  .game-list {
    width:100%; max-width:480px;
    display:flex; flex-direction:column; gap:16px;
  }
  .game-card {
    background:white; border-radius:24px;
    padding:20px; text-decoration:none; color:inherit;
    box-shadow:0 8px 24px rgba(0,0,0,0.08);
    display:flex; align-items:center; gap:16px;
    transition:transform 0.18s, box-shadow 0.18s;
    border:3px solid transparent;
  }
  .game-card:hover, .game-card:active {
    transform:translateY(-4px);
    box-shadow:0 12px 30px rgba(0,0,0,0.14);
  }
  .card-1 { border-color:#FFD166; }
  .card-2 { border-color:#06D6A0; }
  .card-3 { border-color:#EF476F; }
  .icon-wrap {
    width:70px; height:70px; border-radius:20px;
    display:flex; align-items:center; justify-content:center;
    font-size:2.5rem; flex-shrink:0;
  }
  .card-1 .icon-wrap { background:#FFF3D1; }
  .card-2 .icon-wrap { background:#D6F8EF; }
  .card-3 .icon-wrap { background:#FFE5EC; }
  .info-wrap { flex:1; }
  .game-name { font-size:1.25rem; font-weight:bold; color:#333; margin-bottom:4px; }
  .game-desc { font-size:0.85rem; color:#777; line-height:1.4; }
  .badge {
    display:inline-block; font-size:0.75rem; font-weight:bold;
    padding:3px 10px; border-radius:12px; margin-top:8px;
  }
  .card-1 .badge { background:#FFF1C2; color:#B78103; }
  .card-2 .badge { background:#C7F5E9; color:#038562; }
  .card-3 .badge { background:#FFD8E3; color:#C41E47; }
</style>
</head>
<body>

  <div class="header">
    <div class="title">🎈 유아 놀이 게임 모음터</div>
    <div class="subtitle">아이들을 위한 귀엽고 유익한 인터랙티브 웹 게임 3선</div>
  </div>

  <div class="game-list">
    <!-- 게임 1 -->
    <a href="animal-sound-game.html" class="game-card card-1">
      <div class="icon-wrap">🐾</div>
      <div class="info-wrap">
        <div class="game-name">동물 소리 맞추기 게임</div>
        <div class="game-desc">"누구의 소리일까요?" 소리를 듣고 알맞은 동물을 터치해봐요!</div>
        <span class="badge">소리 & 청각 놀이 🎵</span>
      </div>
    </a>

    <!-- 게임 2 -->
    <a href="hidden-animal-game.html" class="game-card card-2">
      <div class="icon-wrap">🔍</div>
      <div class="info-wrap">
        <div class="game-name">숨은 동물 찾기 게임</div>
        <div class="game-desc">풀숲·나무 뒤·상자 안에 쏙! 살짝 보이는 꼬리와 귀를 탭해봐요!</div>
        <span class="badge">탐색 & 인지 놀이 👀</span>
      </div>
    </a>

    <!-- 게임 3 -->
    <a href="emotion-game.html" class="game-card card-3">
      <div class="icon-wrap">🌈</div>
      <div class="info-wrap">
        <div class="game-name">오늘 내 마음은 어떤 색?</div>
        <div class="game-desc">속상한 토끼, 화난 곰의 마음을 공감하고 안아주며 위로해줘요!</div>
        <span class="badge">감정 공감 & 힐링 놀이 💕</span>
      </div>
    </a>
  </div>

</body>
</html>
