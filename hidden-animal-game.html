<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🔍 숨은 동물 찾기</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { width:100vw; height:100vh; overflow:hidden; font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif; touch-action:manipulation; }

.scene { position:relative; width:100vw; height:100vh; overflow:hidden; }

.sky {
  position:absolute; top:0; left:0; right:0; height:52%;
  background:linear-gradient(180deg,#64B5F6 0%,#B3E5FC 65%,#E1F5FE 100%);
}
.sun {
  position:absolute; top:14px; right:28px; width:58px; height:58px;
  background:radial-gradient(circle,#FFF176 30%,#FFEB3B 60%,rgba(255,235,59,0) 100%);
  border-radius:50%; box-shadow:0 0 35px 12px rgba(255,235,59,.45);
  animation:sunPulse 3s ease-in-out infinite;
}
@keyframes sunPulse{0%,100%{box-shadow:0 0 35px 12px rgba(255,235,59,.45)}50%{box-shadow:0 0 55px 22px rgba(255,235,59,.65)}}

.cloud { position:absolute; background:white; border-radius:50px; opacity:.85; }
.cloud::before,.cloud::after { content:''; position:absolute; background:white; border-radius:50%; }

@keyframes cloudDrift { from{transform:translateX(-300px)} to{transform:translateX(110vw)} }

.hills { position:absolute; top:44%; left:0; right:0; height:20%; }
.hill  { position:absolute; border-radius:50% 50% 0 0; bottom:0; }

.ground {
  position:absolute; bottom:0; left:0; right:0; height:52%;
  background:linear-gradient(180deg,#66BB6A 0%,#4CAF50 30%,#388E3C 100%);
}
.grass-line {
  position:absolute; top:0; left:0; right:0; height:28px;
  border-top:4px solid #81C784;
  background:repeating-linear-gradient(90deg,
    transparent 0,transparent 8px,
    #81C784 8px,#81C784 10px,
    transparent 10px,transparent 16px,
    #A5D6A7 16px,#A5D6A7 18px,
    transparent 18px,transparent 24px);
}

.spots-container {
  position:absolute; bottom:30px; left:0; right:0; padding:0 8px;
  display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(2,1fr);
  gap:10px; height:60%;
}

.spot {
  position:relative; display:flex; align-items:flex-end; justify-content:center;
  cursor:pointer; overflow:visible; user-select:none;
}
.spot-env { position:absolute; bottom:0; left:0; right:0; display:flex; align-items:flex-end; justify-content:center; }

.peek { position:absolute; z-index:5; animation:peekBob 2s ease-in-out infinite; }
@keyframes peekBob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

.qmark { position:absolute; font-size:1.6rem; z-index:10; animation:qBob 1.5s ease-in-out infinite; filter:drop-shadow(0 2px 4px rgba(0,0,0,.2)); }
@keyframes qBob{ 0%,100%{transform:translateY(0) rotate(-5deg)} 50%{transform:translateY(-9px) rotate(5deg)} }

.animal-reveal {
  position:absolute; z-index:20; font-size:3.8rem; display:none;
  text-align:center; filter:drop-shadow(0 5px 10px rgba(0,0,0,.3));
}
.animal-name-lbl {
  position:absolute; left:50%; transform:translateX(-50%);
  background:white; border-radius:20px; padding:4px 14px;
  font-size:.88rem; font-weight:bold; color:#ff6b6b;
  box-shadow:0 3px 10px rgba(0,0,0,.2); white-space:nowrap;
  z-index:30; display:none;
  animation:lblPop .4s .25s ease-out both;
}
@keyframes lblPop{ from{transform:translateX(-50%) scale(0);opacity:0} to{transform:translateX(-50%) scale(1);opacity:1} }

.spot.revealed .peek       { display:none !important; }
.spot.revealed .qmark      { display:none; }
.spot.revealed .animal-reveal { display:block; animation:animalPop .65s cubic-bezier(.34,1.56,.64,1) forwards; }
.spot.revealed .animal-name-lbl { display:block; }
@keyframes animalPop{
  0%   { transform:translateY(120px) scale(0) rotate(-12deg); opacity:0; }
  60%  { transform:translateY(-25px) scale(1.25) rotate(6deg); opacity:1; }
  80%  { transform:translateY(6px) scale(.93) rotate(-2deg); }
  100% { transform:translateY(-12px) scale(1.08) rotate(0); opacity:1; }
}

.bush-wrap { position:relative; width:100%; height:80px; }
.bush-l,.bush-r,.bush-m {
  position:absolute; bottom:0;
  border-radius:60% 60% 0 0;
  box-shadow:inset 0 -6px 14px rgba(0,0,0,.14);
}
.bush-l { left:0; width:55%; height:52px; background:radial-gradient(ellipse,#81C784 0%,#4CAF50 100%); }
.bush-r { right:0; width:55%; height:52px; background:radial-gradient(ellipse,#81C784 0%,#4CAF50 100%); }
.bush-m { left:50%; transform:translateX(-50%); width:90%; height:64px; background:radial-gradient(ellipse,#66BB6A 0%,#388E3C 100%); }
.dog-tail {
  position:absolute; right:-6px; bottom:28px; z-index:6;
  width:36px; height:13px;
  background:#C68642; border-radius:0 12px 12px 0; transform:rotate(-22deg);
  box-shadow:2px 2px 5px rgba(0,0,0,.22);
}
.dog-tail::after {
  content:''; position:absolute; right:-7px; top:-7px;
  width:20px; height:20px; background:#C68642; border-radius:50%;
}

.tree-wrap { position:relative; width:100%; height:120px; }
.tree-trunk {
  position:absolute; bottom:0; left:50%; transform:translateX(-50%);
  width:26px; height:68px;
  background:linear-gradient(90deg,#8D6E63,#A1887F,#795548); border-radius:4px;
}
.tree-crown {
  position:absolute; bottom:58px; left:50%; transform:translateX(-50%);
  width:88px; height:78px;
  background:radial-gradient(ellipse,#81C784 0%,#388E3C 100%);
  border-radius:50%; box-shadow:inset 0 -10px 20px rgba(0,0,0,.15);
}
.cat-eyes { position:absolute; bottom:88px; left:50%; transform:translateX(-50%); display:flex; gap:14px; z-index:7; }
.cat-eye  {
  width:13px; height:15px; background:#76FF03; border-radius:50%;
  box-shadow:0 0 8px #76FF03; position:relative;
  animation:eyeGlow 2s ease-in-out infinite;
}
@keyframes eyeGlow{0%,100%{box-shadow:0 0 8px #76FF03}50%{box-shadow:0 0 16px #76FF03,0 0 25px rgba(118,255,3,.4)}}
.cat-eye::after {
  content:''; position:absolute; top:2px; left:50%; transform:translateX(-50%);
  width:4px; height:11px; background:#111; border-radius:2px;
}

.box-wrap { position:relative; width:100%; height:100px; display:flex; justify-content:center; align-items:flex-end; }
.cbox {
  position:relative; width:72px; height:62px;
  background:linear-gradient(180deg,#D7A55A,#C49A3C);
  border-radius:4px; box-shadow:inset -5px 0 14px rgba(0,0,0,.14),3px 3px 10px rgba(0,0,0,.2); overflow:visible;
}
.flap-l {
  position:absolute; top:-18px; left:-3px; width:52%; height:22px;
  background:#C49A3C; transform-origin:bottom left; transform:rotate(-14deg); border-radius:2px 2px 0 0;
}
.flap-r {
  position:absolute; top:-16px; right:-3px; width:52%; height:22px;
  background:#B8892A; transform-origin:bottom right; transform:rotate(14deg); border-radius:2px 2px 0 0;
}
.box-line { position:absolute; left:50%; top:0; bottom:0; width:2px; background:rgba(0,0,0,.1); }
.rabbit-ears { position:absolute; top:-36px; left:50%; transform:translateX(-50%); display:flex; gap:11px; z-index:7; }
.r-ear {
  width:13px; height:38px; background:#f2f2f2; border-radius:50px;
  box-shadow:inset 3px 0 8px rgba(255,182,193,.8); position:relative;
}
.r-ear::after {
  content:''; position:absolute; top:8px; left:50%; transform:translateX(-50%);
  width:5px; height:24px; background:#FFB6C1; border-radius:50px;
}

.rock-wrap { position:relative; width:100%; height:88px; display:flex; align-items:flex-end; justify-content:center; }
.rock-big {
  position:absolute; bottom:0; left:50%; transform:translateX(-50%);
  width:84px; height:58px;
  background:radial-gradient(ellipse at 40% 35%,#9E9E9E,#616161);
  border-radius:55% 55% 45% 45%/60% 60% 40% 40%;
  box-shadow:inset -8px -5px 15px rgba(0,0,0,.2),3px 3px 8px rgba(0,0,0,.15);
}
.rock-sm {
  position:absolute; bottom:0; right:4px;
  width:34px; height:28px;
  background:radial-gradient(ellipse,#BDBDBD,#757575); border-radius:50% 55% 45% 50%;
}
.fox-tail { position:absolute; left:0; bottom:12px; z-index:6; }
.ft-body {
  width:28px; height:22px;
  background:radial-gradient(ellipse,#FF8C00 30%,#FF6B00 100%);
  border-radius:50%; box-shadow:2px 2px 6px rgba(0,0,0,.2); position:relative;
}
.ft-tip {
  position:absolute; bottom:-6px; right:-6px;
  width:15px; height:15px;
  background:radial-gradient(circle,white,#f0f0f0); border-radius:50%;
}

.flower-wrap { position:relative; width:100%; height:90px; }
.flower     { position:absolute; bottom:0; }
.f-stem     { width:4px; height:38px; background:#4CAF50; margin:0 auto; border-radius:2px; }
.f-head     { width:34px; height:34px; border-radius:50%; position:relative; display:flex; align-items:center; justify-content:center; margin:0 auto; }
.f-center   { width:13px; height:13px; border-radius:50%; background:#FFF176; z-index:2; position:relative; box-shadow:0 0 6px rgba(255,235,0,.6); }
.f-petals   { position:absolute; inset:0; }
.petal      { position:absolute; width:11px; height:17px; border-radius:50%; top:50%; left:50%; transform-origin:50% 100%; margin-top:-8px; margin-left:-5px; }
.chick-peek { position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:6; }
.ck-head    { width:30px; height:16px; background:#FFEB3B; border-radius:50% 50% 0 0; margin:0 auto; position:relative; }
.ck-beak    { position:absolute; bottom:-8px; left:50%; transform:translateX(-50%); width:0; height:0; border-left:7px solid transparent; border-right:7px solid transparent; border-top:9px solid #FF9800; }
.ck-eye     { position:absolute; top:3px; width:6px; height:6px; background:#111; border-radius:50%; }
.ck-eye.l   { left:4px; } .ck-eye.r { right:4px; }

.log-wrap { position:relative; width:100%; height:90px; display:flex; align-items:flex-end; justify-content:center; }
.log-body {
  position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
  width:94%; height:44px;
  background:linear-gradient(180deg,#8D6E63,#6D4C41); border-radius:28px;
  box-shadow:inset 0 -5px 14px rgba(0,0,0,.2),0 4px 8px rgba(0,0,0,.2);
}
.log-end { position:absolute; top:50%; width:25px; height:44px; background:radial-gradient(circle,#A1887F 30%,#6D4C41 100%); border-radius:50%; box-shadow:inset 0 0 10px rgba(0,0,0,.3); }
.log-end.l { left:0; transform:translateY(-50%); }
.log-end.r { right:0; transform:translateY(-50%); }
.log-knot  { position:absolute; top:10px; left:33%; width:20px; height:15px; background:radial-gradient(ellipse,#795548,#4E342E); border-radius:50%; opacity:.7; }
.bear-peek { position:absolute; bottom:46px; left:50%; transform:translateX(-50%); z-index:6; }
.b-head    { width:48px; height:30px; background:radial-gradient(ellipse,#A1887F 0%,#795548 100%); border-radius:50% 50% 40% 40%; position:relative; margin:0 auto; box-shadow:0 2px 8px rgba(0,0,0,.2); }
.b-ear     { position:absolute; top:-13px; width:19px; height:19px; background:#8D6E63; border-radius:50%; }
.b-ear.l   { left:1px; } .b-ear.r { right:1px; }
.b-ear::after { content:''; position:absolute; top:4px; left:4px; width:11px; height:11px; background:#FFCDD2; border-radius:50%; }
.b-eyes    { position:absolute; top:8px; left:50%; transform:translateX(-50%); display:flex; gap:14px; }
.b-eye     { width:8px; height:8px; background:#111; border-radius:50%; }
.b-eye::after { content:''; position:absolute; top:1px; right:1px; width:3px; height:3px; background:white; border-radius:50%; }

.ui-overlay { position:fixed; top:0; left:0; right:0; z-index:50; pointer-events:none; }
.top-bar {
  display:flex; justify-content:space-between; align-items:center;
  padding:10px 14px;
  background:rgba(255,255,255,.82); backdrop-filter:blur(12px);
  pointer-events:all; box-shadow:0 2px 12px rgba(0,0,0,.1);
}
.game-title { font-size:1.1rem; font-weight:bold; color:#ff6b6b; }
.found-box  { background:linear-gradient(135deg,#ff9a9e,#fad0c4); color:white; font-weight:bold; padding:6px 18px; border-radius:20px; font-size:.95rem; box-shadow:0 2px 8px rgba(255,100,100,.3); }
.q-banner {
  margin:8px 12px 0;
  background:rgba(255,255,255,.9); border-radius:20px; padding:9px 18px;
  text-align:center; font-size:clamp(.88rem,3vw,1.05rem); font-weight:bold; color:#555;
  box-shadow:0 4px 14px rgba(0,0,0,.1); border:2px solid rgba(255,200,100,.5);
  pointer-events:all; min-height:42px; display:flex; align-items:center; justify-content:center; gap:6px;
}

#intro {
  position:fixed; inset:0; z-index:100;
  background:linear-gradient(135deg,#667eea,#764ba2);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:28px;
}
.intro-icon { font-size:5rem; animation:iBounce 1s ease-in-out infinite alternate; }
@keyframes iBounce{from{transform:translateY(0)}to{transform:translateY(-16px)}}
.intro-title { font-size:2.2rem; font-weight:bold; color:white; text-shadow:2px 2px 0 rgba(0,0,0,.2); margin:10px 0 6px; }
.intro-sub   { font-size:1rem; color:rgba(255,255,255,.85); margin-bottom:22px; line-height:1.6; }
.intro-cast  { font-size:3rem; letter-spacing:6px; margin-bottom:28px; }
.btn-go {
  background:white; color:#764ba2; font-size:1.4rem; font-weight:bold;
  padding:16px 52px; border:none; border-radius:50px; cursor:pointer;
  box-shadow:0 8px 28px rgba(0,0,0,.22); transition:transform .15s; touch-action:manipulation;
}
.btn-go:active { transform:scale(.95); }

#celebration {
  position:fixed; inset:0; z-index:100;
  background:rgba(0,0,0,.5);
  display:none; align-items:center; justify-content:center;
}
#celebration.show { display:flex; }
.cel-box {
  background:white; border-radius:30px; padding:38px 28px;
  text-align:center; max-width:320px; width:90%;
  animation:cPop .5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes cPop{from{transform:scale(0) rotate(-10deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.cel-emoji { font-size:5rem; }
.cel-title { font-size:2rem; font-weight:bold; color:#ff6b6b; margin:10px 0 6px; }
.cel-sub   { font-size:.95rem; color:#888; margin-bottom:22px; line-height:1.6; }
.btn-replay {
  background:linear-gradient(135deg,#667eea,#764ba2); color:white;
  font-size:1.15rem; font-weight:bold; padding:14px 40px;
  border:none; border-radius:30px; cursor:pointer;
  box-shadow:0 5px 15px rgba(102,126,234,.4); touch-action:manipulation;
}

.toast {
  position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,.75); color:white; border-radius:30px; padding:12px 28px;
  font-size:1.05rem; font-weight:bold; z-index:200; opacity:0;
  transition:opacity .3s; pointer-events:none; white-space:nowrap;
}
.toast.show { opacity:1; }
.particle {
  position:fixed; pointer-events:none; z-index:300; font-size:1.8rem;
  animation:pFly 1.3s ease-out forwards;
}
@keyframes pFly{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-210px) scale(.2) rotate(360deg);opacity:0}}
.ripple {
  position:absolute; border-radius:50%; background:rgba(255,255,255,.55);
  width:60px; height:60px; left:50%; top:50%; margin:-30px 0 0 -30px;
  pointer-events:none; animation:ripOut .5s ease-out forwards; z-index:40;
}
@keyframes ripOut{from{transform:scale(0);opacity:.9}to{transform:scale(3.5);opacity:0}}
</style>
</head>
<body>

<div class="scene">
  <div class="sky">
    <div class="sun"></div>
    <div class="cloud" style="width:108px;height:34px;top:10%;left:4%;animation:cloudDrift 22s linear infinite">
      <div style="position:absolute;background:white;border-radius:50%;width:54px;height:52px;top:-27px;left:12px"></div>
      <div style="position:absolute;background:white;border-radius:50%;width:40px;height:38px;top:-18px;left:52px"></div>
    </div>
    <div class="cloud" style="width:78px;height:26px;top:24%;left:38%;animation:cloudDrift 30s -10s linear infinite">
      <div style="position:absolute;background:white;border-radius:50%;width:40px;height:38px;top:-20px;left:8px"></div>
      <div style="position:absolute;background:white;border-radius:50%;width:30px;height:28px;top:-13px;left:36px"></div>
    </div>
    <div class="cloud" style="width:135px;height:40px;top:7%;left:58%;animation:cloudDrift 38s -18s linear infinite">
      <div style="position:absolute;background:white;border-radius:50%;width:68px;height:64px;top:-32px;left:18px"></div>
      <div style="position:absolute;background:white;border-radius:50%;width:52px;height:48px;top:-22px;left:70px"></div>
    </div>
  </div>

  <div class="hills">
    <div class="hill" style="background:linear-gradient(180deg,#A5D6A7,#66BB6A);width:58%;height:78px;left:-8%;border-radius:50% 50% 0 0"></div>
    <div class="hill" style="background:linear-gradient(180deg,#C8E6C9,#81C784);width:48%;height:62px;right:-4%;border-radius:50% 50% 0 0"></div>
    <div class="hill" style="background:linear-gradient(180deg,#A5D6A7,#66BB6A);width:34%;height:48px;left:33%;border-radius:50% 50% 0 0"></div>
  </div>

  <div class="ground"><div class="grass-line"></div></div>

  <div class="spots-container">
    <div class="spot" id="sp-dog" data-id="dog">
      <div class="qmark" style="bottom:84px">❓</div>
      <div class="spot-env">
        <div class="bush-wrap">
          <div class="bush-l"></div>
          <div class="bush-r"></div>
          <div class="bush-m"></div>
          <div class="dog-tail peek"></div>
        </div>
      </div>
      <div class="animal-reveal" style="bottom:62px">🐶</div>
      <div class="animal-name-lbl" style="bottom:138px">강아지 🐶</div>
    </div>

    <div class="spot" id="sp-cat" data-id="cat">
      <div class="qmark" style="bottom:128px">❓</div>
      <div class="spot-env">
        <div class="tree-wrap">
          <div class="tree-crown"></div>
          <div class="tree-trunk"></div>
          <div class="cat-eyes peek">
            <div class="cat-eye"></div><div class="cat-eye"></div>
          </div>
        </div>
      </div>
      <div class="animal-reveal" style="bottom:68px">🐱</div>
      <div class="animal-name-lbl" style="bottom:145px">고양이 🐱</div>
    </div>

    <div class="spot" id="sp-rabbit" data-id="rabbit">
      <div class="qmark" style="bottom:112px">❓</div>
      <div class="spot-env">
        <div class="box-wrap">
          <div class="cbox">
            <div class="flap-l"></div>
            <div class="flap-r"></div>
            <div class="box-line"></div>
            <div class="rabbit-ears peek">
              <div class="r-ear"></div><div class="r-ear"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="animal-reveal" style="bottom:62px">🐰</div>
      <div class="animal-name-lbl" style="bottom:135px">토끼 🐰</div>
    </div>

    <div class="spot" id="sp-fox" data-id="fox">
      <div class="qmark" style="bottom:88px">❓</div>
      <div class="spot-env">
        <div class="rock-wrap">
          <div class="rock-big"></div>
          <div class="rock-sm"></div>
          <div class="fox-tail peek">
            <div class="ft-body"><div class="ft-tip"></div></div>
          </div>
        </div>
      </div>
      <div class="animal-reveal" style="bottom:58px">🦊</div>
      <div class="animal-name-lbl" style="bottom:130px">여우 🦊</div>
    </div>

    <div class="spot" id="sp-chick" data-id="chick">
      <div class="qmark" style="bottom:88px">❓</div>
      <div class="spot-env">
        <div class="flower-wrap">
          <div class="flower" style="left:2%">
            <div class="f-head">
              <div class="f-petals">
                <div class="petal" style="background:#FF8A80;transform:rotate(0deg) translateY(-100%)"></div>
                <div class="petal" style="background:#FF8A80;transform:rotate(60deg) translateY(-100%) rotate(-60deg)"></div>
                <div class="petal" style="background:#FF8A80;transform:rotate(120deg) translateY(-100%) rotate(-120deg)"></div>
                <div class="petal" style="background:#FF8A80;transform:rotate(180deg) translateY(-100%) rotate(-180deg)"></div>
                <div class="petal" style="background:#FF8A80;transform:rotate(240deg) translateY(-100%) rotate(-240deg)"></div>
                <div class="petal" style="background:#FF8A80;transform:rotate(300deg) translateY(-100%) rotate(-300deg)"></div>
              </div>
              <div class="f-center"></div>
            </div>
            <div class="f-stem"></div>
          </div>
          <div class="flower" style="left:33%">
            <div class="f-head">
              <div class="f-petals">
                <div class="petal" style="background:#CE93D8;transform:rotate(0deg) translateY(-100%)"></div>
                <div class="petal" style="background:#CE93D8;transform:rotate(60deg) translateY(-100%) rotate(-60deg)"></div>
                <div class="petal" style="background:#CE93D8;transform:rotate(120deg) translateY(-100%) rotate(-120deg)"></div>
                <div class="petal" style="background:#CE93D8;transform:rotate(180deg) translateY(-100%) rotate(-180deg)"></div>
                <div class="petal" style="background:#CE93D8;transform:rotate(240deg) translateY(-100%) rotate(-240deg)"></div>
                <div class="petal" style="background:#CE93D8;transform:rotate(300deg) translateY(-100%) rotate(-300deg)"></div>
              </div>
              <div class="f-center"></div>
            </div>
            <div class="f-stem"></div>
          </div>
          <div class="flower" style="right:2%">
            <div class="f-head">
              <div class="f-petals">
                <div class="petal" style="background:#80DEEA;transform:rotate(0deg) translateY(-100%)"></div>
                <div class="petal" style="background:#80DEEA;transform:rotate(60deg) translateY(-100%) rotate(-60deg)"></div>
                <div class="petal" style="background:#80DEEA;transform:rotate(120deg) translateY(-100%) rotate(-120deg)"></div>
                <div class="petal" style="background:#80DEEA;transform:rotate(180deg) translateY(-100%) rotate(-180deg)"></div>
                <div class="petal" style="background:#80DEEA;transform:rotate(240deg) translateY(-100%) rotate(-240deg)"></div>
                <div class="petal" style="background:#80DEEA;transform:rotate(300deg) translateY(-100%) rotate(-300deg)"></div>
              </div>
              <div class="f-center"></div>
            </div>
            <div class="f-stem"></div>
          </div>
          <div class="chick-peek peek">
            <div class="ck-head">
              <div class="ck-eye l"></div>
              <div class="ck-eye r"></div>
              <div class="ck-beak"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="animal-reveal" style="bottom:58px">🐥</div>
      <div class="animal-name-lbl" style="bottom:130px">병아리 🐥</div>
    </div>

    <div class="spot" id="sp-bear" data-id="bear">
      <div class="qmark" style="bottom:96px">❓</div>
      <div class="spot-env">
        <div class="log-wrap">
          <div class="log-body">
            <div class="log-end l"></div>
            <div class="log-end r"></div>
            <div class="log-knot"></div>
          </div>
          <div class="bear-peek peek">
            <div class="b-head">
              <div class="b-ear l"></div>
              <div class="b-ear r"></div>
              <div class="b-eyes">
                <div class="b-eye"></div><div class="b-eye"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="animal-reveal" style="bottom:62px">🐻</div>
      <div class="animal-name-lbl" style="bottom:135px">곰 🐻</div>
    </div>
  </div>
</div>

<div class="ui-overlay">
  <div class="top-bar">
    <div class="game-title">🔍 숨은 동물 찾기</div>
    <div class="found-box">🐾 <span id="found-num">0</span> / 6</div>
  </div>
  <div class="q-banner" id="q-banner">🌿 동물 친구들이 숨어있어요! 찾아봐요!</div>
</div>

<div id="intro">
  <div class="intro-icon">🔍</div>
  <div class="intro-title">숨은 동물<br>찾기!</div>
  <div class="intro-sub">동물 친구들이 꼭꼭 숨었어요<br>살짝 보이는 힌트를 눌러봐요! 👀</div>
  <div class="intro-cast">🐶🐱🐰🦊🐥🐻</div>
  <button class="btn-go" onclick="startGame()">🎮 시작!</button>
</div>

<div id="celebration">
  <div class="cel-box">
    <div class="cel-emoji">🎊</div>
    <div class="cel-title">모두 찾았어요!</div>
    <div class="cel-sub">동물 친구 6마리를 모두 찾았어요!<br>정말 최고예요! ⭐⭐⭐</div>
    <button class="btn-replay" onclick="replayGame()">🔄 다시 하기</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const ANIMAL_DATA = {
  dog:    { name:'강아지', cry:'멍멍! 멍멍!',   pop:'멍멍! 강아지였어요!',   ptcl:['⭐','🦴','🐾','💛'] },
  cat:    { name:'고양이', cry:'야옹~ 야옹~',    pop:'야옹~ 고양이였어요!',   ptcl:['⭐','🐟','✨','💚'] },
  rabbit: { name:'토끼',   cry:'깡충~ 깡충~',    pop:'폴짝! 토끼였어요!',     ptcl:['⭐','🥕','💨','🤍'] },
  fox:    { name:'여우',   cry:'여우가 나왔어요!',pop:'여우였어요!',           ptcl:['⭐','🍂','🌟','🧡'] },
  chick:  { name:'병아리', cry:'삐약! 삐약!',    pop:'삐약삐약! 병아리였어요!',ptcl:['⭐','🌻','💛','🐣'] },
  bear:   { name:'곰',     cry:'어흥~ 어흥!',    pop:'어흥! 곰이었어요!',     ptcl:['⭐','🍯','🌿','🤎'] },
};

let found = 0;
let gameOn = false;
const synth = window.speechSynthesis;

function speak(text, rate=0.85, pitch=1.3, cb=null) {
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR'; u.rate = rate; u.pitch = pitch; u.volume = 1;
  if (cb) u.onend = cb;
  synth.speak(u);
}

function setBanner(txt) {
  document.getElementById('q-banner').textContent = txt;
}

function startGame() {
  document.getElementById('intro').style.display = 'none';
  document.getElementById('celebration').classList.remove('show');
  gameOn = true; found = 0;
  document.getElementById('found-num').textContent = '0';
  document.querySelectorAll('.spot').forEach(s => s.classList.remove('revealed'));
  setBanner('👀 동물 친구들이 숨어있어요! 눌러봐요!');
  setTimeout(() => speak('동물 친구들이 꼭꼭 숨었어요! 살짝 보이는 힌트를 찾아서 눌러봐요!', .85, 1.3), 300);
}

function replayGame() { startGame(); }

function handleSpot(spot) {
  if (!gameOn || spot.classList.contains('revealed')) return;
  const id = spot.dataset.id;
  const a  = ANIMAL_DATA[id];

  spot.classList.add('revealed');
  found++;
  document.getElementById('found-num').textContent = found;

  const rp = document.createElement('div'); rp.className = 'ripple';
  spot.appendChild(rp); setTimeout(()=>rp.remove(), 600);

  spawnParticles(spot, a.ptcl);
  showToast(a.pop);
  setBanner('🎉 ' + a.pop);

  speak(a.name + '이에요! ' + a.cry + ' 잘 찾았어요!', .88, 1.3, ()=>{
    if (found < 6) {
      setTimeout(()=>{ setBanner('👀 더 찾아봐요! 아직 숨은 친구가 있어요~'); speak('또 찾아봐요!', .9, 1.3); }, 400);
    } else {
      setTimeout(showCelebration, 500);
    }
  });
}

function showCelebration() {
  document.getElementById('celebration').classList.add('show');
  speak('와! 동물 친구 6마리를 모두 찾았어요! 정말 대단해요! 짝짝짝!', .85, 1.3);
  for (let i=0; i<22; i++) {
    setTimeout(()=>{
      const p = document.createElement('div'); p.className = 'particle';
      p.textContent = ['🎊','⭐','🌟','✨','🎉','💫','🐾','🎈'][Math.floor(Math.random()*8)];
      p.style.left = Math.random()*95 + 'vw';
      p.style.top  = Math.random()*90 + 'vh';
      p.style.animationDuration = (.7+Math.random()*.9) + 's';
      document.body.appendChild(p); setTimeout(()=>p.remove(), 1800);
    }, i*70);
  }
}

function spawnParticles(spot, icons) {
  const r = spot.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  for (let i=0; i<12; i++) {
    setTimeout(()=>{
      const p = document.createElement('div'); p.className = 'particle';
      p.textContent = icons[Math.floor(Math.random()*icons.length)];
      p.style.left = (cx + (Math.random()-.5)*r.width)  + 'px';
      p.style.top  = (cy + (Math.random()-.5)*r.height) + 'px';
      p.style.animationDuration = (.8+Math.random()*.6) + 's';
      p.style.animationDelay    = (Math.random()*.25) + 's';
      document.body.appendChild(p); setTimeout(()=>p.remove(), 1600);
    }, i*40);
  }
}

let toastT;
function showToast(msg, dur=2200) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(()=>t.classList.remove('show'), dur);
}

document.querySelectorAll('.spot').forEach(spot => {
  spot.addEventListener('click', () => handleSpot(spot));
});

window.addEventListener('load', ()=>{
  setTimeout(()=> speak('숨은 동물 찾기 게임에 오신걸 환영해요!', .85, 1.3), 700);
});
</script>
</body>
</html>
