<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐾 동물 소리 게임</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
    background: linear-gradient(135deg, #a8edea, #fed6e3, #ffecd2);
    min-height: 100vh;
    overflow-x: hidden;
    touch-action: manipulation;
  }

  .clouds { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .cloud {
    position: absolute; background: white; border-radius: 50px; opacity: 0.5;
    animation: floatCloud linear infinite;
  }
  .cloud::before, .cloud::after {
    content: ''; position: absolute; background: white; border-radius: 50%;
  }
  .cloud-1 { width: 120px; height: 40px; top: 8%; animation-duration: 22s; animation-delay: 0s; }
  .cloud-1::before { width: 70px; height: 60px; top: -30px; left: 15px; }
  .cloud-1::after  { width: 50px; height: 50px; top: -20px; left: 50px; }
  .cloud-2 { width: 90px;  height: 30px; top: 18%; animation-duration: 28s; animation-delay: -8s; }
  .cloud-2::before { width: 50px; height: 45px; top: -22px; left: 10px; }
  .cloud-2::after  { width: 40px; height: 38px; top: -15px; left: 38px; }
  .cloud-3 { width: 150px; height: 45px; top: 5%;  animation-duration: 35s; animation-delay: -14s; }
  .cloud-3::before { width: 80px; height: 70px; top: -35px; left: 20px; }
  .cloud-3::after  { width: 60px; height: 55px; top: -25px; left: 70px; }
  @keyframes floatCloud { from { left: -200px; } to { left: 110%; } }

  header {
    position: relative; z-index: 10;
    text-align: center;
    padding: 18px 16px 10px;
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(10px);
    border-bottom: 3px solid rgba(255,255,255,0.7);
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  header h1 { font-size: clamp(1.4rem, 5vw, 2rem); color: #ff6b6b; text-shadow: 2px 2px 0 #fff; }
  header h1 span { display: inline-block; animation: bounce 0.8s infinite alternate; }
  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-6px); } }

  .hud {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 20px;
    position: relative; z-index: 10;
    background: rgba(255,255,255,0.4);
  }
  .score-box {
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    border-radius: 20px; padding: 6px 18px;
    font-size: 1.1rem; font-weight: bold; color: #fff;
    box-shadow: 0 3px 10px rgba(255,100,100,0.3);
  }
  .streak-box {
    background: linear-gradient(135deg, #a18cd1, #fbc2eb);
    border-radius: 20px; padding: 6px 18px;
    font-size: 1rem; font-weight: bold; color: #fff;
    box-shadow: 0 3px 10px rgba(161,140,209,0.3);
  }

  main { position: relative; z-index: 5; padding: 12px 10px 80px; }

  .screen { display: none; }
  .screen.active { display: block; }

  #home-screen { text-align: center; padding: 20px 10px; }
  .home-title {
    font-size: clamp(2rem, 8vw, 3.5rem);
    color: #ff6b6b; text-shadow: 3px 3px 0 #fff;
    margin-bottom: 8px; line-height: 1.2;
  }
  .home-subtitle { font-size: clamp(1rem, 3vw, 1.3rem); color: #888; margin-bottom: 30px; }
  .home-animals { font-size: 4rem; letter-spacing: 8px; margin-bottom: 30px; animation: wiggle 2s infinite; }
  @keyframes wiggle {
    0%,100% { transform: rotate(0deg); }
    25% { transform: rotate(-3deg); }
    75% { transform: rotate(3deg); }
  }
  .btn-start {
    display: inline-block;
    background: linear-gradient(135deg, #ff6b6b, #ffa07a);
    color: white; font-size: clamp(1.2rem, 4vw, 1.6rem);
    font-weight: bold; padding: 18px 50px;
    border: none; border-radius: 50px; cursor: pointer;
    box-shadow: 0 6px 20px rgba(255,107,107,0.5);
    transition: all 0.15s; margin: 10px;
    touch-action: manipulation;
  }
  .btn-start:active { transform: scale(0.95); box-shadow: 0 3px 10px rgba(255,107,107,0.4); }
  .btn-free {
    background: linear-gradient(135deg, #43e97b, #38f9d7);
    box-shadow: 0 6px 20px rgba(67,233,123,0.4);
  }

  .question-panel {
    background: linear-gradient(135deg, #fff9c4, #fff3e0);
    border-radius: 24px; padding: 16px 20px; margin-bottom: 16px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(255,200,50,0.3);
    border: 3px solid #ffe082;
    min-height: 110px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .question-label {
    font-size: clamp(0.85rem, 2.5vw, 1rem); color: #aaa; margin-bottom: 4px;
  }
  .question-text {
    font-size: clamp(1.5rem, 5vw, 2rem); color: #ff6b6b; font-weight: bold;
    min-height: 2.5rem;
  }
  .sound-wave {
    display: none; margin-top: 8px;
  }
  .sound-wave.playing { display: flex; gap: 5px; align-items: center; }
  .bar {
    width: 6px; border-radius: 3px; background: #ff6b6b;
    animation: wave 0.6s ease-in-out infinite alternate;
  }
  .bar:nth-child(1) { height: 12px; animation-delay: 0s; }
  .bar:nth-child(2) { height: 22px; animation-delay: 0.1s; }
  .bar:nth-child(3) { height: 30px; animation-delay: 0.2s; }
  .bar:nth-child(4) { height: 22px; animation-delay: 0.3s; }
  .bar:nth-child(5) { height: 12px; animation-delay: 0.4s; }
  @keyframes wave { from { transform: scaleY(0.4); } to { transform: scaleY(1); } }

  .replay-btn {
    background: linear-gradient(135deg, #6c63ff, #a8a0ff);
    color: white; border: none; border-radius: 20px;
    padding: 8px 22px; font-size: 1rem; cursor: pointer;
    margin-top: 10px; box-shadow: 0 3px 10px rgba(108,99,255,0.4);
    touch-action: manipulation;
  }
  .replay-btn:active { transform: scale(0.95); }

  .animals-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .animal-card {
    position: relative;
    background: white;
    border-radius: 24px;
    padding: 14px 8px 10px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 5px 18px rgba(0,0,0,0.10);
    border: 4px solid transparent;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.2s;
    user-select: none;
    touch-action: manipulation;
    -webkit-user-select: none;
  }
  .animal-card:active { transform: scale(0.94); }

  .animal-card.correct {
    border-color: #43e97b;
    box-shadow: 0 6px 24px rgba(67,233,123,0.6);
    animation: popCorrect 0.5s forwards;
  }
  @keyframes popCorrect {
    0% { transform: scale(1); }
    30% { transform: scale(1.18); }
    60% { transform: scale(0.95); }
    100% { transform: scale(1.05); }
  }
  .animal-card.wrong {
    border-color: #ff6b6b;
    animation: shakeWrong 0.4s forwards;
  }
  @keyframes shakeWrong {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-8px); }
    80% { transform: translateX(8px); }
  }
  .animal-card.disabled { pointer-events: none; }

  .animal-emoji {
    font-size: clamp(2.8rem, 10vw, 4.2rem);
    display: block; line-height: 1.1;
    transition: transform 0.2s;
  }
  .animal-card:active .animal-emoji { transform: scale(1.2); }

  .animal-name {
    display: block;
    font-size: clamp(0.75rem, 2.5vw, 0.95rem);
    font-weight: bold; color: #555;
    margin-top: 6px;
  }
  .animal-sound-badge {
    display: inline-block;
    background: linear-gradient(135deg, #f093fb, #f5576c);
    color: white; font-size: 0.7rem; font-weight: bold;
    border-radius: 12px; padding: 2px 8px; margin-top: 4px;
  }

  #result-overlay {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.5);
    align-items: center; justify-content: center;
  }
  #result-overlay.show { display: flex; }
  .result-box {
    background: white; border-radius: 30px; padding: 40px 30px;
    text-align: center; max-width: 340px; width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: slideUp 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .result-emoji { font-size: 5rem; }
  .result-title { font-size: 2rem; font-weight: bold; color: #ff6b6b; margin: 10px 0; }
  .result-score { font-size: 1.2rem; color: #888; margin-bottom: 20px; }
  .result-stars { font-size: 2.5rem; letter-spacing: 6px; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #ff6b6b, #ffa07a);
    color: white; font-size: 1.2rem; font-weight: bold;
    padding: 14px 40px; border: none; border-radius: 30px;
    cursor: pointer; box-shadow: 0 5px 15px rgba(255,107,107,0.4);
    touch-action: manipulation;
  }

  .toast {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.75); color: white;
    border-radius: 30px; padding: 12px 30px; font-size: 1.2rem;
    z-index: 200; opacity: 0; transition: opacity 0.3s;
    pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  .particle {
    position: fixed; pointer-events: none; z-index: 300;
    font-size: 2rem;
    animation: flyUp 1.2s ease-out forwards;
  }
  @keyframes flyUp {
    0%   { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-220px) scale(0.3) rotate(360deg); opacity: 0; }
  }

  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    display: flex;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(14px);
    border-top: 2px solid rgba(255,255,255,0.7);
    box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
  }
  .nav-btn {
    flex: 1; border: none; background: none; padding: 12px 6px 10px;
    font-size: 0.85rem; font-weight: bold; color: #aaa;
    cursor: pointer; transition: all 0.2s; touch-action: manipulation;
  }
  .nav-btn .nav-icon { font-size: 1.6rem; display: block; }
  .nav-btn.active { color: #ff6b6b; }
  .nav-btn.active .nav-icon { animation: navPop 0.3s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes navPop { from { transform: scale(0.7); } to { transform: scale(1); } }

  .progress-bar-wrap {
    background: rgba(0,0,0,0.08); border-radius: 10px; height: 10px; margin-bottom: 14px;
  }
  .progress-bar {
    height: 100%; border-radius: 10px;
    background: linear-gradient(90deg, #ff6b6b, #ffa07a);
    transition: width 0.4s ease;
  }
</style>
</head>
<body>

<div class="clouds">
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>
</div>

<header>
  <h1>
    <span style="animation-delay:0s">🐾</span>
    동물 소리 게임
    <span style="animation-delay:0.2s">🎵</span>
  </h1>
</header>

<div class="hud" id="hud" style="display:none">
  <div class="score-box">⭐ 점수: <span id="score-val">0</span></div>
  <div class="streak-box">🔥 연속: <span id="streak-val">0</span></div>
</div>

<main>
  <div id="home-screen" class="screen active">
    <div class="home-title">동물 소리<br>맞춰봐요! 🎉</div>
    <div class="home-subtitle">귀여운 동물 친구들이 기다려요</div>
    <div class="home-animals">🐶🐱🐄🦆🐷🐸</div>
    <button class="btn-start" onclick="startGame()">🎮 게임 시작</button>
    <br>
    <button class="btn-start btn-free" onclick="startFree()">🔊 자유 탐험</button>
  </div>

  <div id="game-screen" class="screen">
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progress-bar" style="width:0%"></div>
    </div>
    <div class="question-panel">
      <div class="question-label">📢 이 소리는 누구일까요?</div>
      <div class="question-text" id="question-text">🎵 소리를 들어보세요!</div>
      <div class="sound-wave" id="sound-wave">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div>
      </div>
      <button class="replay-btn" id="replay-btn" onclick="replaySound()" style="display:none">
        🔁 다시 듣기
      </button>
    </div>
    <div class="animals-grid" id="game-grid"></div>
  </div>

  <div id="free-screen" class="screen">
    <div style="text-align:center; margin-bottom:14px; color:#888; font-size:0.95rem">
      🐾 동물을 눌러 소리를 들어봐요!
    </div>
    <div class="animals-grid" id="free-grid"></div>
  </div>
</main>

<div id="result-overlay">
  <div class="result-box">
    <div class="result-emoji" id="res-emoji">🎊</div>
    <div class="result-title" id="res-title">잘했어요!</div>
    <div class="result-score" id="res-score"></div>
    <div class="result-stars" id="res-stars"></div>
    <button class="btn-restart" onclick="restartGame()">🎮 다시 하기</button>
    <br><br>
    <button class="btn-restart" style="background:linear-gradient(135deg,#43e97b,#38f9d7); box-shadow:none" onclick="goHome()">🏠 홈으로</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<nav>
  <button class="nav-btn active" id="nav-home" onclick="goHome()">
    <span class="nav-icon">🏠</span>홈
  </button>
  <button class="nav-btn" id="nav-game" onclick="startGame()">
    <span class="nav-icon">🎮</span>게임
  </button>
  <button class="nav-btn" id="nav-free" onclick="startFree()">
    <span class="nav-icon">🔊</span>탐험
  </button>
</nav>

<script>
const ANIMALS = [
  { id:'dog',   emoji:'🐶', name:'강아지', sound:'멍멍!',     color:'#FFD6A5', utterance:'멍멍 멍멍' },
  { id:'cat',   emoji:'🐱', name:'고양이', sound:'야옹~',     color:'#CAFFBF', utterance:'야옹 야옹' },
  { id:'cow',   emoji:'🐄', name:'소',     sound:'음메~',     color:'#BDB2FF', utterance:'음메 음메' },
  { id:'duck',  emoji:'🦆', name:'오리',   sound:'꽥꽥!',     color:'#9BF6FF', utterance:'꽥꽥 꽥꽥' },
  { id:'pig',   emoji:'🐷', name:'돼지',   sound:'꿀꿀~',     color:'#FFB3C6', utterance:'꿀꿀 꿀꿀' },
  { id:'frog',  emoji:'🐸', name:'개구리', sound:'개굴개굴!', color:'#A8E6CF', utterance:'개굴개굴' },
];

let score = 0, streak = 0, questionIndex = 0, totalQuestions = 8, currentAnswer = null, isAnswering = false;
let synth = window.speechSynthesis;

function speak(text, rate=0.85, pitch=1.3, onEnd=null) {
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR'; u.rate = rate; u.pitch = pitch; u.volume = 1;
  if (onEnd) u.onend = onEnd;
  synth.speak(u);
  return u;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const map = { 'home-screen':'nav-home', 'game-screen':'nav-game', 'free-screen':'nav-free' };
  if (map[id]) document.getElementById(map[id]).classList.add('active');
  const hud = document.getElementById('hud');
  hud.style.display = id === 'game-screen' ? 'flex' : 'none';
}

function goHome() {
  synth.cancel();
  showScreen('home-screen');
}

function startFree() {
  synth.cancel();
  showScreen('free-screen');
  buildFreeGrid();
  setTimeout(() => speak('동물을 눌러보세요!', 0.9, 1.3), 300);
}

function buildFreeGrid() {
  const grid = document.getElementById('free-grid');
  grid.innerHTML = '';
  ANIMALS.forEach(a => {
    const card = document.createElement('div');
    card.className = 'animal-card';
    card.style.background = `radial-gradient(circle at 30% 30%, white, ${a.color})`;
    card.innerHTML = `
      <span class="animal-emoji">${a.emoji}</span>
      <span class="animal-name">${a.name}</span>
      <span class="animal-sound-badge">${a.sound}</span>
    `;
    const handler = () => { animateCard(card); playAnimalSound(a, card); };
    card.addEventListener('click', handler);
    grid.appendChild(card);
  });
}

function playAnimalSound(animal, card) {
  synth.cancel();
  const u1 = new SpeechSynthesisUtterance(animal.utterance);
  u1.lang = 'ko-KR'; u1.rate = 0.8; u1.pitch = 1.4; u1.volume = 1;
  synth.speak(u1);
  showToast(`${animal.emoji} ${animal.sound}`, 1800);
}

function animateCard(card) {
  card.style.transform = 'scale(1.15)';
  setTimeout(() => card.style.transform = 'scale(1)', 200);
}

function startGame() {
  score = 0; streak = 0; questionIndex = 0;
  updateHUD();
  showScreen('game-screen');
  document.getElementById('result-overlay').classList.remove('show');
  setTimeout(() => {
    speak('동물 소리를 잘 들어보세요! 어떤 동물일까요?', 0.85, 1.3, () => {
      setTimeout(nextQuestion, 400);
    });
  }, 300);
}

function updateHUD() {
  document.getElementById('score-val').textContent = score;
  document.getElementById('streak-val').textContent = streak;
}

function nextQuestion() {
  if (questionIndex >= totalQuestions) { showResult(); return; }
  isAnswering = false;
  document.getElementById('progress-bar').style.width = (questionIndex / totalQuestions * 100) + '%';
  currentAnswer = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];
  buildGameGrid();
  document.getElementById('question-text').textContent = '🎵 소리를 듣고 있어요...';
  document.getElementById('sound-wave').classList.add('playing');
  document.getElementById('replay-btn').style.display = 'none';

  const introText = `누구의 소리일까요?`;
  speak(introText, 0.85, 1.3, () => {
    setTimeout(() => {
      playQuestionSound(currentAnswer, () => {
        document.getElementById('question-text').textContent = '어떤 동물일까요? 🤔';
        document.getElementById('sound-wave').classList.remove('playing');
        document.getElementById('replay-btn').style.display = 'inline-block';
        isAnswering = true;
      });
    }, 200);
  });
}

function playQuestionSound(animal, cb) {
  const u = new SpeechSynthesisUtterance(animal.utterance);
  u.lang = 'ko-KR'; u.rate = 0.75; u.pitch = 1.5; u.volume = 1;
  u.onend = cb || null;
  synth.speak(u);
}

function replaySound() {
  if (!currentAnswer) return;
  document.getElementById('sound-wave').classList.add('playing');
  document.getElementById('replay-btn').style.display = 'none';
  playQuestionSound(currentAnswer, () => {
    document.getElementById('sound-wave').classList.remove('playing');
    document.getElementById('replay-btn').style.display = 'inline-block';
  });
}

function buildGameGrid() {
  const grid = document.getElementById('game-grid');
  grid.innerHTML = '';
  const shuffled = [...ANIMALS].sort(() => Math.random() - 0.5);
  shuffled.forEach(a => {
    const card = document.createElement('div');
    card.className = 'animal-card';
    card.dataset.id = a.id;
    card.style.background = `radial-gradient(circle at 30% 30%, white, ${a.color})`;
    card.innerHTML = `<span class="animal-emoji">${a.emoji}</span><span class="animal-name">${a.name}</span>`;
    const handler = () => handleAnswer(a, card);
    card.addEventListener('click', handler);
    grid.appendChild(card);
  });
}

function handleAnswer(chosen, card) {
  if (!isAnswering) return;
  isAnswering = false;
  document.getElementById('replay-btn').style.display = 'none';
  const allCards = document.querySelectorAll('#game-grid .animal-card');
  allCards.forEach(c => c.classList.add('disabled'));

  if (chosen.id === currentAnswer.id) {
    card.classList.add('correct');
    score += (streak >= 2 ? 20 : 10);
    streak++;
    updateHUD();
    spawnParticles(card, ['⭐','🌟','✨','🎉','💫']);
    showToast('🎊 정답! 잘했어요!', 1800);
    speak(`맞아요! ${chosen.name}이 ${chosen.sound} 하고 울어요! 훌륭해요!`, 0.9, 1.3, () => {
      questionIndex++;
      setTimeout(nextQuestion, 600);
    });
  } else {
    card.classList.add('wrong');
    streak = 0;
    updateHUD();
    allCards.forEach(c => {
      if (c.dataset.id === currentAnswer.id) c.classList.add('correct');
    });
    showToast(`💡 ${currentAnswer.name}이에요!`, 2000);
    speak(`아쉬워요~ ${currentAnswer.name}이 ${currentAnswer.sound} 했어요! 다시 해봐요!`, 0.85, 1.2, () => {
      questionIndex++;
      setTimeout(nextQuestion, 700);
    });
  }
}

function showResult() {
  document.getElementById('progress-bar').style.width = '100%';
  const pct = score / (totalQuestions * 10);
  let emoji, title;
  if (pct >= 0.9)      { emoji='🏆'; title='완벽해요! 천재!'; }
  else if (pct >= 0.7) { emoji='🌟'; title='잘했어요!'; }
  else if (pct >= 0.5) { emoji='😊'; title='좋아요! 연습해봐요!'; }
  else                 { emoji='🐣'; title='다시 도전해봐요!'; }

  const stars = Math.round(pct * 5);
  document.getElementById('res-emoji').textContent = emoji;
  document.getElementById('res-title').textContent = title;
  document.getElementById('res-score').textContent = `점수: ${score}점`;
  document.getElementById('res-stars').textContent = '⭐'.repeat(stars) + '☆'.repeat(5-stars);
  document.getElementById('result-overlay').classList.add('show');
  speak(`게임 끝! ${title} 점수는 ${score}점이에요!`, 0.85, 1.3);
}

function restartGame() {
  document.getElementById('result-overlay').classList.remove('show');
  startGame();
}

function spawnParticles(card, icons) {
  const rect = card.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  for (let i = 0; i < 8; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = icons[Math.floor(Math.random() * icons.length)];
    p.style.left = (cx + (Math.random()-0.5)*80) + 'px';
    p.style.top  = (cy + (Math.random()-0.5)*40) + 'px';
    p.style.animationDelay = (Math.random()*0.3) + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1500);
  }
}

let toastTimer = null;
function showToast(msg, dur=1800) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), dur);
}

window.addEventListener('load', () => {
  setTimeout(() => speak('안녕하세요! 동물 소리 게임에 오신걸 환영해요!', 0.85, 1.3), 800);
});
</script>
